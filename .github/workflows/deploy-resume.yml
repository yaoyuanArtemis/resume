name: Deploy Resume to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'cv_1-zh.pdf'

jobs:
  update-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: yaoyuanArtemis/yaoyuanArtemis.github.io
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target-repo

      - name: Copy PDF and Push
        run: |
          cp cv_1-zh.pdf target-repo/static/images/resume.pdf

          cd target-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/images/resume.pdf
          git commit -m "chore: update resume.pdf" || echo "No changes to commit"
          git push
